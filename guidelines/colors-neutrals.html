<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Paper, surface bands, and the ink ramp" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--opc-paper)}body{padding:16px;box-sizing:border-box;width:700px;height:150px;overflow:hidden;font:var(--type-small);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--opc-line)}.lbl{font:var(--type-mono);font-size:11px;color:var(--text-muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lbl b{display:block;font:var(--type-small);font-weight:600;color:var(--text-body)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--opc-paper)"></div><div class="lbl"><b>Paper</b>--opc-paper<br>#FFFFFF</div></div><div class="sw"><div class="chip" style="background:var(--opc-surface)"></div><div class="lbl"><b>Surface</b>--opc-surface<br>#F3F5F6</div></div><div class="sw"><div class="chip" style="background:var(--opc-surface-2)"></div><div class="lbl"><b>Surface 2</b>--opc-surface-2<br>#E9EDF0</div></div><div class="sw"><div class="chip" style="background:var(--opc-faint)"></div><div class="lbl"><b>Faint</b>--opc-faint<br>#8A95A3</div></div><div class="sw"><div class="chip" style="background:var(--opc-muted)"></div><div class="lbl"><b>Muted</b>--opc-muted<br>#596776</div></div><div class="sw"><div class="chip" style="background:var(--opc-ink)"></div><div class="lbl"><b>Ink</b>--opc-ink<br>#162130</div></div></div></body></html>
