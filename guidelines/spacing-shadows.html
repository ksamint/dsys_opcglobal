<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows" subtitle="Cards carry no shadow; floating layers only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--opc-paper)}body{padding:16px;box-sizing:border-box;width:700px;height:170px;overflow:hidden;font:var(--type-small);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--opc-line)}.lbl{font:var(--type-mono);font-size:11px;color:var(--text-muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lbl b{display:block;font:var(--type-small);font-weight:600;color:var(--text-body)}</style></head><body><div class="row" style="gap:20px;padding:6px;height:100%;align-items:center"><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--opc-paper);border:1px solid var(--opc-line);box-shadow:none"></div><div class="lbl"><b>No shadow</b>cards, tables</div></div><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--opc-paper);border:1px solid var(--opc-line);box-shadow:var(--shadow-1)"></div><div class="lbl"><b>--shadow-1</b>subtle lift (rare)</div></div><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--opc-paper);border:1px solid var(--opc-line);box-shadow:var(--shadow-2)"></div><div class="lbl"><b>--shadow-2</b>menus, toasts, tooltips</div></div><div class="sw"><div style="height:72px;border-radius:var(--radius-md);background:var(--opc-paper);border:1px solid var(--opc-line);box-shadow:var(--shadow-3)"></div><div class="lbl"><b>--shadow-3</b>dialogs</div></div></div></body></html>
