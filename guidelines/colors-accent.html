<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--opc-paper)}body{padding:16px;box-sizing:border-box;width:700px;height:150px;overflow:hidden;font:var(--type-small);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--opc-line)}.lbl{font:var(--type-mono);font-size:11px;color:var(--text-muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lbl b{display:block;font:var(--type-small);font-weight:600;color:var(--text-body)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--opc-gold)"></div><div class="lbl"><b>Gold</b>--opc-gold<br>#B79B63</div></div><div class="sw"><div class="chip" style="background:var(--opc-gold-deep)"></div><div class="lbl"><b>Gold deep</b>--opc-gold-deep<br>#A88B52</div></div><div class="sw"><div class="chip" style="background:var(--opc-gold-tint)"></div><div class="lbl"><b>Gold tint</b>--opc-gold-tint<br>#F5F0E4</div></div><div class="sw"><div class="chip" style="background:var(--opc-red)"></div><div class="lbl"><b>Red</b>--opc-red<br>#A23E3E</div></div><div class="sw"><div class="chip" style="background:var(--opc-red-tint)"></div><div class="lbl"><b>Red tint</b>--opc-red-tint<br>#F6E9E9</div></div></div></body></html>
