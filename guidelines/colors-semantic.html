<!-- @dsCard group="Colors" viewport="700x170" name="Semantic status" subtitle="Derived status colours (not in the source theme); each pairs with a tint for backgrounds" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--opc-paper)}body{padding:16px;box-sizing:border-box;width:700px;height:170px;overflow:hidden;font:var(--type-small);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--opc-line)}.lbl{font:var(--type-mono);font-size:11px;color:var(--text-muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lbl b{display:block;font:var(--type-small);font-weight:600;color:var(--text-body)}</style></head><body><div class="row"><div class="sw"><div style="display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--opc-line);height:64px"><div style="flex:1;background:var(--opc-success)"></div><div style="flex:1;background:var(--opc-success-tint)"></div></div><div class="lbl"><b style="text-transform:capitalize">success</b>--opc-success / --opc-success-tint</div><div style="display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--opc-success-tint);color:var(--opc-success);font-weight:600;font-size:12px"><span style="width:6px;height:6px;border-radius:50%;background:var(--opc-success)"></span>Ratified</div></div><div class="sw"><div style="display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--opc-line);height:64px"><div style="flex:1;background:var(--opc-warning)"></div><div style="flex:1;background:var(--opc-warning-tint)"></div></div><div class="lbl"><b style="text-transform:capitalize">warning</b>--opc-warning / --opc-warning-tint</div><div style="display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--opc-warning-tint);color:var(--opc-warning);font-weight:600;font-size:12px"><span style="width:6px;height:6px;border-radius:50%;background:var(--opc-warning)"></span>In review</div></div><div class="sw"><div style="display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--opc-line);height:64px"><div style="flex:1;background:var(--opc-danger)"></div><div style="flex:1;background:var(--opc-danger-tint)"></div></div><div class="lbl"><b style="text-transform:capitalize">danger</b>--opc-danger / --opc-danger-tint</div><div style="display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--opc-danger-tint);color:var(--opc-danger);font-weight:600;font-size:12px"><span style="width:6px;height:6px;border-radius:50%;background:var(--opc-danger)"></span>Withdrawn</div></div><div class="sw"><div style="display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--opc-line);height:64px"><div style="flex:1;background:var(--opc-info)"></div><div style="flex:1;background:var(--opc-info-tint)"></div></div><div class="lbl"><b style="text-transform:capitalize">info</b>--opc-info / --opc-info-tint</div><div style="display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--opc-info-tint);color:var(--opc-info);font-weight:600;font-size:12px"><span style="width:6px;height:6px;border-radius:50%;background:var(--opc-info)"></span>Draft</div></div></div></body></html>
