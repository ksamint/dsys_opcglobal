<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="2 small · 4 default · 8 large · pill for badges and tags only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--opc-paper)}body{padding:16px;box-sizing:border-box;width:700px;height:150px;overflow:hidden;font:var(--type-small);color:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--opc-line)}.lbl{font:var(--type-mono);font-size:11px;color:var(--text-muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lbl b{display:block;font:var(--type-small);font-weight:600;color:var(--text-body)}</style></head><body><div class="row" style="gap:16px"><div class="sw"><div style="height:64px;border:1px solid var(--opc-line-strong);background:var(--opc-surface);border-radius:var(--radius-sm)"></div><div class="lbl"><b>--radius-sm · 2px</b>inputs inner, chips</div></div><div class="sw"><div style="height:64px;border:1px solid var(--opc-line-strong);background:var(--opc-surface);border-radius:var(--radius-md)"></div><div class="lbl"><b>--radius-md · 4px</b>buttons, inputs, cards</div></div><div class="sw"><div style="height:64px;border:1px solid var(--opc-line-strong);background:var(--opc-surface);border-radius:var(--radius-lg)"></div><div class="lbl"><b>--radius-lg · 8px</b>dialogs, image frames</div></div><div class="sw"><div style="height:64px;border:1px solid var(--opc-line-strong);background:var(--opc-surface);border-radius:var(--radius-pill)"></div><div class="lbl"><b>--radius-pill · 999px</b>badges, tags</div></div></div></body></html>
