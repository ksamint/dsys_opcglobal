<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OPC Global</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}body{display:grid;grid-template-columns:960px 320px;font-family:var(--font-display)}.main{background:var(--opc-navy);display:flex;align-items:center;justify-content:center}.main img{width:520px;height:520px;object-fit:contain}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%;height:100%}</style></head>
<body><div class="main"><img src="assets/logo/opcglobal-white.png" alt="OPC Global"></div><div class="strip"><div style="background:var(--opc-gold)"></div><div style="background:var(--opc-gold-deep)"></div><div style="background:var(--opc-red)"></div><div style="background:var(--opc-navy-deep)"></div></div></body></html>
