<body><div id="root"></div>

const A = '../../assets/logo';
function Demo(){
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div className="row">

    <div className="row" style={{color:'var(--opc-navy)'}}>
      {['globe','users','file-text','shield-check','handshake','layers','map-pin','mail','search','arrow-right','chevron-down','check','x','menu','download','calendar'].map(n=><Icon key={n} name={n} />)}

    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
