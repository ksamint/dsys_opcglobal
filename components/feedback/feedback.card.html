<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px;width:700px;height:360px;box-sizing:border-box;overflow:hidden;background:var(--opc-surface)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { Toast, Tooltip, Dialog, Button, IconButton, Icon, Checkbox } = window.OPCGlobalDesignSystem_c086b9;
function Demo(){
  const [open, setOpen] = React.useState(false);
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      <Toast tone="success" title="Application submitted" description="Reference OPC-APP-2041. We reply within five working days." onDismiss={()=>{}} style={{width:'100%'}} />
      <Toast tone="danger" title="Could not save draft" description="Check your connection and try again." action={{label:'Retry',onClick:()=>{}}} onDismiss={()=>{}} style={{width:'100%'}} />
      <Toast tone="warning" title="Comment period closes 2026-10-01" style={{width:'100%'}} />
      <Toast title="Draft saved" description="OPC-STD-004 · v0.3" onDismiss={()=>{}} style={{width:'100%'}} />
    </div>
    <div style={{display:'flex',alignItems:'center',gap:16,padding:'10px 0'}}>
      <Tooltip content="Download PDF"><IconButton label="Download PDF" variant="secondary"><Icon name="download" /></IconButton></Tooltip>
      <Tooltip content="Share standard" placement="bottom"><IconButton label="Share" variant="secondary"><Icon name="share-2" /></IconButton></Tooltip>
      <Tooltip content="One Person Company" placement="right"><span style={{borderBottom:'1px dotted var(--opc-gold-deep)',cursor:'help'}}>OPC</span></Tooltip>
      <span style={{marginLeft:'auto'}} />
      <Button variant="secondary" onClick={()=>setOpen(true)} leading={<Icon name="file-check" />}>Open dialog</Button>
    </div>
    <Dialog open={open} onClose={()=>setOpen(false)} title="Submit application?" description="The standards team reviews applications within five working days." size="sm"
      footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancel</Button><Button onClick={()=>setOpen(false)}>Submit</Button></>}>
      <Checkbox label="I agree to the membership charter" defaultChecked />
    </Dialog>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
